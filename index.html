<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Must stay a plain inline script: `defer` or `type="module"` would
         run it after first paint, which is the entire flash it exists to
         prevent. Mirrors prefs.ts's cache key and resolution. -->
    <script>
      try {
        var pref = localStorage.getItem("nr.theme") || "system";
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        /* keep the markup default */
      }
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ninja-recorder</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <header class="app-bar">
      <div class="app-bar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
              <circle cx="12" cy="12" r="3.4" fill="currentColor" />
            </svg>
          </span>
          <div class="brand-text">
            <span class="brand-name">ninja&#8209;recorder</span>
            <span class="brand-sub">VOD library</span>
          </div>
        </div>

        <div class="status-strip" role="status" aria-live="polite">
          <span class="status-pill" id="status-lcu" data-state="unknown">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-lcu-text">Checking client&#8230;</span>
          </span>
          <span class="status-pill" id="status-game" data-state="idle">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-game-text">Idle</span>
          </span>
        </div>

        <button
          id="open-settings-btn"
          type="button"
          class="icon-btn ghost has-badge"
          aria-label="Settings"
          title="Settings"
        >
          <!-- The entire announcement that an update exists. Deliberately
               not a toast or a notification: CI releases every commit on
               main, so this would fire most days (DEVELOPMENT.md §14). -->
          <span id="update-badge" class="badge" hidden>
            <span class="visually-hidden">An update is available</span>
          </span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.88.34H9.1a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z" />
          </svg>
        </button>

        <!-- Hidden unless the build carries the `devtools` Cargo feature:
             `probeDevPortal` asks the backend and unhides only if the
             dev commands are actually registered. -->
        <button
          id="open-dev-portal-btn"
          type="button"
          class="icon-btn ghost"
          aria-label="Dev portal"
          title="Dev portal"
          hidden
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M9 3h6" />
            <path d="M10 3v6.2L4.9 18a2 2 0 0 0 1.7 3h10.8a2 2 0 0 0 1.7-3L14 9.2V3" />
            <path d="M7.6 14h8.8" />
          </svg>
        </button>
      </div>
    </header>

    <!-- The recorder's own state, not the app's: shown when the daemon is not
         there and hidden when it is. Above `main` rather than inside a view,
         because it is true of the whole window regardless of which view is
         showing (WS3.8). -->
    <div id="daemon-strip" class="daemon-strip" role="status" aria-live="polite" hidden></div>

    <main class="container">
      <!-- Where the Svelte root mounts (WS4.1), and since WS4.5 the whole of
           the app: `App.svelte` renders every view and registers each with the
           router itself. What is left of this file is the app bar, the quit
           dialog and the anti-flash boot script, none of which is a view.
           WS4.6 takes those. -->
      <div id="svelte-root"></div>
    </main>

    <dialog id="quit-dialog" class="quit-dialog">
      <form method="dialog">
        <h2>Quit while recording?</h2>
        <p>
          A game is being recorded right now. Quitting finishes and saves that
          recording first, which takes a few seconds, and then nothing is
          recorded in the background until you open ninja-recorder again.
        </p>
        <div class="quit-dialog-actions">
          <button value="cancel" class="ghost">Keep recording</button>
          <button value="quit" class="danger">Quit anyway</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="alert" hidden></div>
  </body>
</html>
