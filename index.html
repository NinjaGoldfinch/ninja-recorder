<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Must stay a plain inline script: `defer` or `type="module"` would
         run it after first paint, which is the entire flash it exists to
         prevent. Mirrors prefs.ts's cache key and resolution. -->
    <script>
      try {
        var pref = localStorage.getItem("nr.theme") || "system";
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        /* keep the markup default */
      }
    </script>
    <link rel="stylesheet" href="/src/lib/styles/app.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ninja-recorder</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <!-- **The whole of the markup.** Every element the app has is rendered by
         `App.svelte` since WS4.6: the app bar, the daemon strip, the views,
         the quit dialog and the toast were all hand-written here until then.

         What is left in `<head>` cannot move into a component and is not
         markup: the anti-flash boot script has to run before first paint, and
         so does the stylesheet it depends on. -->
    <div id="app-root"></div>
  </body>
</html>
