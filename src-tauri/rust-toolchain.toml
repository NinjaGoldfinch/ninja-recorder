# The compiler this project is built with, pinned exactly.
#
# Not `channel = "stable"`. A floating channel means two CI runs a week apart
# can use two different compilers, so a build that breaks on Tuesday and not on
# Monday has two candidate causes and no way to tell them apart. Pinning moves
# every new lint and every behaviour change into a dated, reviewable diff of
# its own.
#
# CI uses `dtolnay/rust-toolchain` with **no version argument** so it reads this
# file. Passing `@stable` there would silently win and put the pin back to
# floating without changing anything visible in this file.
#
# Bump in its own PR. New lints are the expected content of that diff —
# `-D warnings` means they are errors, so a bump that also carried a feature
# would make "which change broke this" unanswerable again.
#
# 1.98.1 was stable on 2026-09-01 and is what the tree was moved to edition
# 2024 under. Edition 2024 needs 1.85 or newer; this is the version the
# `unsafe_op_in_unsafe_fn` and `static mut` work below was actually verified
# against, not a floor.
[toolchain]
channel = "1.98.1"
# `clippy` is a gate, so it has to come with the toolchain rather than be
# installed separately — a runner that skipped the install step would otherwise
# skip the gate and still go green.
#
# `rustfmt` is **not** a gate and this tree is not rustfmt-formatted. It is
# listed because `cargo fmt` should still work when someone reaches for it on a
# single file, and because leaving it out makes the failure a missing component
# rather than a diff. **Do not run `cargo fmt` across the tree**: it rewrites
# 63 of the 76 source files, and no rustfmt configuration comes close to what
# is committed. See CLAUDE.md, "The Rust tree is not rustfmt-formatted".
components = ["rustfmt", "clippy"]
