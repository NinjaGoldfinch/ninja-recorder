[package]
name = "ninja-recorder"
version = "0.6.3"
description = "Lightweight League of Legends VOD recorder"
authors = ["ninja"]
edition = "2021"
# GPL-2.0-only, not our choice of convenience: linking libobs (GPLv2) for
# the capture backend (Phase 6) obligates the whole distributed binary.
# See DEVELOPMENT.md §2.1.
license = "GPL-2.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ninja_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
# Cross-platform free-disk-space query for the record-start preflight check
# (Phase 9 / DEVELOPMENT.md §6) — std has no such API.
fs2 = "0.4"

# Real capture backend (Phase 6). Fork of github.com/FFFFFFFXXXXXXX/libobs-recorder
# that swaps the injection-based `game_capture` source for `window_capture`
# (Windows.Graphics.Capture) — see the fork's readme and DEVELOPMENT.md
# §1.1/§2.2 for why upstream can't be used as-is. GPL-2.0, same as libobs
# itself; this project is GPL-2.0 accordingly (README).
[target.'cfg(target_os = "windows")'.dependencies]
libobs-recorder = { git = "https://github.com/NinjaGoldfinch/libobs-recorder.git" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

