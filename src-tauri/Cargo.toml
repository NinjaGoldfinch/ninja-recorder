[package]
name = "ninja-recorder"
version = "0.8.0"
description = "Lightweight League of Legends VOD recorder"
authors = ["ninja"]
edition = "2024"
# GPL-2.0-only, not our choice of convenience: linking libobs (GPLv2) for
# the capture backend obligates the whole distributed binary.
# See DEVELOPMENT.md §2.1.
license = "GPL-2.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ninja_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Dev portal (dev.html + the `dev_*` commands in `src/dev/`). Off by
# default so nothing in `src/dev/` — raw SQL execution, row inserts, DB
# wipe, state-machine injection — is compiled into a shipped installer.
# Enable for local work with `npm run tauri:dev`, which passes
# `--features devtools`. Release workflows need no change.
#
# Pulls in tauri's own `devtools` feature, which is what puts the web
# inspector in a *release* build. Debug builds always have it, so
# `tauri:dev` never noticed it was missing — but the devtools installer is
# a release build, which left the one bundle that exists for debugging as
# the one bundle you could not debug: a portal that failed to load had no
# way to say why.
devtools = ["tauri/devtools"]

# The contract emitter, `src/bin/gen-contract.rs`. Off by default because a
# binary Cargo builds is a binary Tauri installs: the bundler collects every
# bin target this package produces and puts them all beside the app.
#
# That is how a repo tool ended up in a user's install directory, and once it
# is there, `mainBinaryName` is the only thing deciding it is not what the
# Start Menu launches. Not building it is the half of that fix which does not
# depend on getting a config field right.
#
# It is not `devtools`: that feature ships a bundle of its own, and this
# belongs in neither. Nothing outside CI and a regeneration needs it, and both
# ask for it by name.
contract-gen = []

# Declared rather than auto-discovered, which is what lets `required-features`
# be attached to it. `src/main.rs` is still found on its own.
[[bin]]
name = "gen-contract"
path = "src/bin/gen-contract.rs"
required-features = ["contract-gen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what makes `TrayIconBuilder` exist; it is off by default.
# No `image-*` feature is needed because the tray reuses the already-decoded
# `default_window_icon()` from the bundle rather than decoding a file.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TypeScript declarations for every type that crosses the IPC boundary (WS2.2).
#
# `serde-compat` is on by default and is the point: several of these types carry
# `#[serde(tag = "...")]` and `rename_all`, and the generated TypeScript has to
# describe the wire shape serde actually produces, not the Rust shape.
#
# **`#[ts(export)]` is deliberately not used.** It writes one `.ts` file per type
# as a side effect of `cargo test`, which would scatter the output and make it a
# test artifact. WS2.5's `gen-contract` collects the declarations instead, so the
# emission happens once, in one place, and is reviewable as a single diff.
#
# `no-serde-warnings` because of exactly one attribute: `#[serde(other)]` on
# `AudioPreset::Unknown`, the forward-compatibility catch-all that stops a
# downgrade turning a newer build's preset into a hard deserialize error.
# ts-rs cannot parse it and warns that it is ignored — and `-D warnings` makes
# that fatal.
#
# Ignoring it is correct here: `other` changes *deserialization behaviour*, not
# the type's shape, and the emitted TypeScript already carries every variant
# including `{ "preset": "unknown" }`.
#
# The cost, stated: this silences the whole class, so a future serde attribute
# that ts-rs cannot parse *and* that does change the shape would go unmentioned.
# `contract::types`' tests are the cover for that — they assert on the rendered
# declarations rather than trusting the absence of a warning, and
# `audio_presets_keep_every_variant` pins this exact case.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
thiserror = "2"
# Version comparison for the daemon's update check (`update::is_newer`).
# `tauri-plugin-updater` did this behind an `AppHandle`, which the daemon does
# not have. Already in the tree through that plugin, so naming it adds no crate.
semver = "1"
# The daemon's update install: `minisign-verify` is what makes a download ours
# (`update::verify`). Already in the tree through `tauri-plugin-updater`, so
# naming it adds no crate and no licence.
#
# `zip` was named here too, to unpack "the NSIS bundle the updater artifact is".
# It is not one: since Tauri v2 the updater artifact *is* the installer, signed
# in place, so there was never an archive to open and the crate is gone with the
# code that opened it.
minisign-verify = "0.2"
# The daemon builds no `tauri::App`, so it cannot ask an `AppHandle` where the
# data directory is — and `app_data_dir()` is `dirs::data_dir()` joined with the
# identifier. This is the crate Tauri itself uses, at the version it uses, so
# the daemon and the UI are running the same function rather than two
# implementations of one rule (`daemon::Paths::resolve`). Already in the tree
# through tauri; naming it here adds no crate.
dirs = "6"
# The facade the capture crates log through: `ipc-link` hands every line libobs
# writes to the worker's stdout to `log::info!` (#221). This app does not log
# through it (`log.rs`); `daemon::log_bridge` only installs a receiver so those
# lines land in a file instead of being dropped. `std` is what provides
# `set_boxed_logger`. Already in the tree through tauri and the fork, so naming
# it adds no crate and no licence.
log = { version = "0.4", features = ["std"] }
# "net" and "io-util" are WS3.1's: the daemon's RPC server is a byte stream
# (a named pipe on Windows, a Unix socket in its tests) framed with
# `AsyncBufReadExt::lines`. "rt-multi-thread" is what gives `spawn_blocking`
# somewhere to put the blocking SQLite commands.
# "signal" is WS3.2's: Ctrl-C is how the daemon is stopped on a dev box, and
# the stop has to be graceful — an in-flight recording is finalized rather than
# dropped, which is the difference between a library row and an orphan file.
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "rt-multi-thread", "net", "io-util", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
base64 = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
# Cross-platform free-disk-space query for the record-start preflight check
# (DEVELOPMENT.md §6) — std has no such API.
fs2 = "0.4"
tauri-plugin-notification = "2"
# The daemon's notifications (`daemon/notify.rs`). This is the crate the plugin
# above wraps, and it was already in the tree through it, so naming it here adds
# no crate. The daemon needs it directly because the plugin's API hangs off an
# `AppHandle` and the daemon builds no Tauri app.
notify-rust = "4"
# Start-on-login (`daemon::autostart`). The registry entry — not a
# `settings_kv` row — is the source of truth, so the checkbox cannot drift from
# what Windows will actually do (DEVELOPMENT.md §12).
#
# This is the crate `tauri-plugin-autostart` wraps, and it was in the tree
# through that plugin until #151 replaced it, so naming it directly added no
# crate and no licence. The plugin itself is gone: its API hangs off an
# `AppHandle`, the daemon builds no Tauri app, and the daemon is the process
# that owns this (§3.1). Using the crate underneath keeps the behaviour rather
# than reimplementing it — including reading Task Manager's own
# `StartupApproved\Run` override, so an entry switched off from the Startup
# tab reads as disabled.
auto-launch = "0.5"
# In-app updates (DEVELOPMENT.md §14). Windows-only in practice: `latest.json`
# carries a `windows-x86_64` entry and nothing else, so a macOS build's check
# simply finds nothing. Registered in `lib.rs` only when the `devtools` feature
# is *off* — a dev bundle that updated itself would replace itself with the
# production app.
tauri-plugin-updater = "2"

# Real capture backend. Fork of github.com/FFFFFFFXXXXXXX/libobs-recorder
# that swaps the injection-based `game_capture` source for `window_capture`
# (Windows.Graphics.Capture) — see the fork's readme and DEVELOPMENT.md
# §1.1/§2.2 for why upstream can't be used as-is. GPL-2.0, same as libobs
# itself; this project is GPL-2.0 accordingly (README).
[target.'cfg(target_os = "windows")'.dependencies]
# Pinned to a **tag**, not a branch. `v2.0.0` on the fork is the tip of
# `multi-track-audio` at the moment WS1.7 pinned it: the patch that gives each
# audio source its own encoder and track (DEVELOPMENT.md §2.5), on top of the
# `window_capture` swap that removes injection.
#
# A branch pin resolves to whatever the branch points at *today*, so two
# checkouts a week apart can build different backends with no diff between
# them saying so. `Cargo.lock` hides that most of the time and stops hiding it
# the moment someone runs `cargo update`.
#
# `version` is here for a second reason: a git dependency without one is a
# wildcard as far as cargo-deny is concerned, which is why `deny.toml`'s
# `[bans] wildcards` sat at `warn`. With both, it is `deny`.
libobs-recorder = { git = "https://github.com/NinjaGoldfinch/libobs-recorder.git", tag = "v2.0.0", version = "2.0.0" }

# The daemon's tray and its menu, on the daemon's own Win32 message loop
# (`daemon/pump.rs`). These are the crates Tauri itself wraps, by the same
# authors, and both are already in the tree through it, so naming them here
# adds no crate and no licence.
#
# `default-features = false` because the defaults are the Linux ones (gtk,
# libappindicator, libxdo). This whole section is Windows-only, so they would
# not be selected anyway; saying so is what stops a future non-Windows daemon
# quietly acquiring a GTK dependency.
tray-icon = { version = "0.24", default-features = false }
muda = { version = "0.19", default-features = false }
# Win32_Media_Audio + the COM/property-store features are the microphone
# picker (recorder/devices.rs): IMMDeviceEnumerator to list input endpoints,
# IPropertyStore + PKEY_Device_FriendlyName for their display names. Done
# here rather than through libobs so the picker still works when the capture
# backend failed to initialize.
#
# `Win32_System_Variant` looks unused from our imports and is not: windows-rs
# gates `IPropertyStore::GetValue` on it, because the method returns a
# `PROPVARIANT`. Drop the feature and the method silently stops existing —
# a "no method named GetValue" error at the call site, nowhere near here.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_System_Com",
    # The daemon's pipe ACL (daemon/pipe_acl.rs). `Win32_Security` is the
    # token and `SECURITY_ATTRIBUTES` half, `..._Authorization` is the SDDL
    # pair that turns a string into a descriptor and a SID into a string, and
    # `Win32_System_Threading` is `OpenProcessToken`, which lives there rather
    # than under Security.
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    # SetStdHandle, for pointing the libobs worker's inherited stderr at a
    # file it can actually be read from (recorder/libobs/worker_log.rs).
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    # The own capture backend (`recorder/own/win/`, #236), from the spike's
    # list (`spikes/p0c-video/Cargo.toml`) less what only the spike used.
    # `RtlGetVersion`, for the build number: GetVersionEx lies to a binary
    # with no compatibility manifest.
    "Wdk_System_SystemServices",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # `timeBeginPeriod`, so the cadence loop sleeps to the millisecond.
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    # `LoadLibraryExW`, to ask whether Media Foundation is installed before
    # the first call into its delay-loaded DLLs (`build.rs`).
    "Win32_System_LibraryLoader",
    # QueryPerformanceCounter: the one clock video, audio and WGC share.
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # The WinRT half: the capture item, the frame pool and the session.
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
    # `ApiInformation`, to ask whether the border can be turned off (#219).
    "Foundation_Metadata",
    # The status `GraphicsCaptureAccess::RequestAccessAsync` returns: the
    # method is gated on it.
    "Security_Authorization_AppCapabilityAccess",
    # `WNDCLASSW`, for the window the own backend's WGC test captures.
    "Win32_Graphics_Gdi",
] }
# `#[implement]` (the own backend's sample-release callback) expands to
# `windows_core::` paths, so the crate it names has to be a direct
# dependency, at the version `windows` itself uses: already in the lock
# through `windows`, so no new crate and no new licence.
windows-core = "0.62.2"

# Full DWARF for our own crate is what fills `target/` — 30k codegen-unit
# objects at ~500 KB of debug info each, ~8 GB before this. Line tables keep
# file/line in backtraces and panics; the cost is no variable inspection in
# lldb, which we don't use on the Rust side.
[profile.dev]
debug = "line-tables-only"

# The shipped binary. There was no release profile at all until now, so it was
# built with symbols in and no cross-crate optimisation.
#
# Measured on the Linux build (stub recorder, so smaller than Windows but the
# same crate graph): 25.6 MB -> 17.7 MB from `strip` alone, ~31%.
#
# The cost is stated rather than hidden: a stripped binary has no function
# names in a panic backtrace. That is affordable here because `log.rs` is the
# thing anyone actually reads when a recording goes wrong (§13) — the backtrace
# was never the diagnostic. `panic = "abort"` is deliberately *not* set: it
# would save a little more, but Tauri and wry both catch unwinds, and trading a
# crash-on-panic for a few hundred KB is the wrong side of that bargain for an
# app that is supposed to be recording your game.
[profile.release]
strip = true
# One codegen unit and cross-crate LTO: slower to build in CI, smaller and
# faster to run. The Windows bundle is dominated by libobs and ffmpeg
# (~200 MB of the 248 MB install), so this is the smaller half of the problem
# — but it is the half that costs nothing to fix.
lto = true
codegen-units = 1
