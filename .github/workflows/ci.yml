name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the full matrix — including the devtools bundle below, which pull
  # requests skip — can be exercised from a branch before it is merged.
  # A manual run only builds unless `draft_release` is set, which is both
  # how the draft path gets tested off main and the escape hatch for
  # re-cutting a draft from a commit whose own run was lost.
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Mint a version and leave a draft release"
        type: boolean
        default: false

# Superseded pull-request runs are cancelled, which is most of the minute
# saving. Pushes to main are deliberately NOT grouped together: each one
# owes a draft release, so cancelling an in-flight run because a second
# commit landed would silently drop that commit's build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every push to main gets its own draft release, so the version has to be
  # settled before anything compiles: it is baked into the binary, the
  # installer filename and the About block, and a version chosen after the
  # build would disagree with all three.
  #
  # It is derived from the commit's distance to the newest real tag rather
  # than "highest version seen, plus one". That makes it a pure function of
  # the commit: two pushes landing at once cannot claim the same version,
  # and re-running a commit updates its own draft instead of minting a
  # second one. Draft releases carry no git tag until somebody publishes
  # them, which is exactly what holds the base still while drafts pile up
  # — publish one and it becomes the new base, so the count restarts from
  # a higher minor and the sequence stays monotonic either way.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      # Full history and every tag: the distance below is measured against
      # them, and a shallow clone would silently under-count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick version
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.draft_release }}
        run: |
          set -euo pipefail
          base=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -n "$base" ]; then
            n=$(git rev-list --count "${base}..HEAD")
            base_version=${base#v}
          else
            n=$(git rev-list --count HEAD)
            base_version=0.0.0
          fi
          major=${base_version%%.*}
          minor=$(printf '%s' "$base_version" | cut -d. -f2)
          version="${major}.$((minor + n)).0"

          # Only a push to main — or an explicitly opted-in manual run —
          # mints a version. Pull requests build at whatever the tree
          # already says, so their installers stay honest about what they
          # are. The commit-count guard matters in its own right: at zero
          # commits past the base tag the arithmetic lands back on the base
          # version, which would overwrite a release that already exists.
          if [ "$n" -gt 0 ] && { [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ]; }; then
            release=true
          else
            release=false
            version=$(node -p "require('./package.json').version")
          fi

          echo "base=${base:-<none>} commits=$n -> version=$version release=$release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Windows-only: GitHub bills macOS runners at 10x wall-clock against the
  # free plan's 2,000 min/month, and this job's work — tsc, cargo test,
  # clippy — is platform-independent, so running it twice bought almost
  # nothing for most of CI's minute spend. The `build` job below still
  # runs the full matrix natively, so macOS-specific compile breakage
  # (cfg'd code, the Phase 1 stub recorder) is still caught before a
  # release. Kept as a single-entry matrix so re-adding macos-latest here
  # is a one-word change.
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # The dev portal (`src-tauri/src/dev/`, DEVELOPMENT.md §10) is behind
      # an off-by-default feature, so nothing above compiles it. Without
      # this step a `#[cfg(feature = "devtools")]` mistake stays green
      # until someone runs the portal locally.
      - name: Run Rust tests (devtools)
        working-directory: src-tauri
        run: cargo test --features devtools

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings

      - name: Clippy (devtools)
        working-directory: src-tauri
        run: cargo clippy --features devtools --no-deps -- -D warnings

  # Deliberately NOT `needs: test` — the two jobs are independent work and
  # gating cost the whole test job (~4min) of pure latency on every run
  # before the slow Windows bundle even started. Nothing unreviewed can
  # escape as a result: release.yml only accepts an artifact from a ci.yml
  # run whose *overall* conclusion is success, and a failed `test` job
  # fails the run. The one thing given up is minutes, not safety — a PR
  # that breaks clippy now still pays for a build it can't use.
  #
  # The matrix is built by expression so the devtools bundle (a second
  # full Tauri build, DEVELOPMENT.md §10) gets its own runner rather than
  # running serially after the production bundle in the same job — that
  # second build used to sit squarely on the critical path.
  #
  # It is never attached to a release. The installer it produces carries
  # raw SQL execution, arbitrary row writes, a database wipe and
  # state-machine injection, and a draft asset that must be deleted before
  # publishing is one forgotten click away from shipping all of that. It
  # is reachable only as a workflow artifact — from a push to main or a
  # `workflow_dispatch` run — which expires on its own and can never be
  # published by accident. Pull requests skip it: it is a second full
  # Windows bundle, and anyone who wants one can dispatch a run.
  #
  # Windows-only: the dev portal exists to exercise the backend without
  # League running, and the macOS build is the Phase 1 stub recorder, so a
  # macOS devtools installer cost a 10x-billed runner to exercise a stub.
  # Re-adding it is one more entry in the matrix below.
  build:
    name: Build (${{ matrix.platform }}${{ matrix.devtools && ', devtools' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name != 'pull_request'
          && '[{"platform":"windows-latest","bundles":"nsis"},{"platform":"macos-latest","bundles":"dmg"},{"platform":"windows-latest","bundles":"nsis","devtools":true}]'
          || '[{"platform":"windows-latest","bundles":"nsis"},{"platform":"macos-latest","bundles":"dmg"}]') }}
    needs: version
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Stamped in, never committed: the release is cut from the artifacts
      # rather than from a bumped commit, so main keeps no bump commits and
      # CI never pushes to itself. Deliberately after `Cache Rust`, whose
      # key is hashed from the committed manifests — editing them first
      # would mint a new key every run and make the Rust cache permanently
      # cold. All three files matter: Cargo.toml is what cargo compiles,
      # tauri.conf.json is what names the installer, and package.json is
      # what vite bakes into `__APP_VERSION__` for the About block.
      - name: Set release version
        if: needs.version.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const toml = "src-tauri/Cargo.toml";
            fs.writeFileSync(toml, fs.readFileSync(toml, "utf8")
              .replace(/^version = ".*"$/m, `version = "${v}"`));
          '
          echo "building as $VERSION"

      # The staged backend is keyed on the exact libobs-recorder revision
      # Cargo.lock links against, which does double duty: it is a stable
      # cache key, and it stops the out-of-process worker staged below
      # from drifting away from the in-process crate the app is compiled
      # against — the old `git clone --depth 1` followed whatever HEAD
      # happened to be, while Cargo used the locked rev.
      - name: Resolve libobs backend revision
        if: matrix.platform == 'windows-latest'
        id: libobs-rev
        shell: bash
        run: |
          rev=$(grep -A3 '^name = "libobs-recorder"$' src-tauri/Cargo.lock |
            sed -nE 's/^source = ".*#([0-9a-f]{40})"$/\1/p')
          if [ -z "$rev" ]; then
            echo "::error::Could not read the libobs-recorder revision out of src-tauri/Cargo.lock" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # Both staging steps below write into src-tauri/target/libobs and
      # neither output depends on this repo's own sources, so the whole
      # directory caches as a unit. ffmpeg has no version to key on (see
      # the download step), so bump FFMPEG_EPOCH in the key to pull a
      # fresher build; GitHub also evicts caches untouched for 7 days,
      # which refreshes it on its own.
      - name: Cache libobs backend + ffmpeg
        if: matrix.platform == 'windows-latest'
        id: libobs-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/target/libobs
          key: libobs-${{ runner.os }}-${{ steps.libobs-rev.outputs.rev }}-ffmpeg-epoch1

      # Builds the out-of-process libobs worker from our capture-backend
      # fork (github.com/NinjaGoldfinch/libobs-recorder — see
      # DEVELOPMENT.md §2.1) and stages it + its bundled libobs DLLs at
      # src-tauri/target/libobs/, where tauri.windows.conf.json picks it up
      # as a bundle resource and lib.rs's `LibObsRecorder::new` resolves it
      # from at runtime. Deliberately a step outside Cargo's own dependency
      # graph, not a Cargo artifact-dependency — that requires nightly
      # Rust + the unstable `bindeps` flag, which would force the whole
      # project (including every macOS dev's `cargo check`) onto nightly
      # just for a Windows-only optional binary. Unverified — see
      # DEVELOPMENT.md §2.2's Phase 6 status note.
      - name: Stage libobs capture backend
        if: matrix.platform == 'windows-latest' && steps.libobs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $rev = "${{ steps.libobs-rev.outputs.rev }}"
          New-Item -ItemType Directory -Force -Path ../libobs-recorder-build | Out-Null
          git init ../libobs-recorder-build
          git -C ../libobs-recorder-build remote add origin https://github.com/NinjaGoldfinch/libobs-recorder.git
          git -C ../libobs-recorder-build fetch --depth 1 origin $rev
          git -C ../libobs-recorder-build checkout FETCH_HEAD
          cargo build --release --manifest-path ../libobs-recorder-build/Cargo.toml --bin extprocess_recorder
          $dllDir = Get-ChildItem ../libobs-recorder-build/build-helper -Directory -Filter "libobs_*" |
            Sort-Object Name -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/target/libobs | Out-Null
          Copy-Item "$($dllDir.FullName)/*" src-tauri/target/libobs -Recurse -Force
          Copy-Item ../libobs-recorder-build/target/release/extprocess_recorder.exe src-tauri/target/libobs/extprocess_recorder.exe -Force

      # ffmpeg.exe is bundled into the same `libobs` resource folder so
      # `LibObsRecorder::stop` (src-tauri/src/recorder/libobs/mod.rs) can
      # remux each recording to a seekable faststart MP4 after capture —
      # the crash-safe fragmented format `start()` records with has no
      # seek index (DEVELOPMENT.md, Phase 6 follow-up). Optional at
      # runtime (lib.rs resolves it with `.ok()`), so a failed/missing
      # download here degrades to unseekable-but-playable recordings
      # rather than breaking the build. BtbN's "latest" release is a
      # continuously-updated static build, not a pinned version — same
      # looseness as the fork clone above had before it was pinned.
      - name: Stage ffmpeg for faststart remux
        if: matrix.platform == 'windows-latest' && steps.libobs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $bin = Get-ChildItem ffmpeg-extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/target/libobs | Out-Null
          Copy-Item $bin.FullName src-tauri/target/libobs/ffmpeg.exe -Force

      # Native build on each platform's own runner — never cross-compiled.
      # DEVELOPMENT.md §9: NSIS on Windows (not MSI, matches the documented
      # installer choice); dmg on macOS is the standard Tauri bundle format
      # there. macOS builds only exercise the stub recorder (Phase 1) —
      # real capture is Windows-only (Phase 6).
      #
      # The devtools variant additionally layers tauri.devtools.conf.json
      # over the config, which does two things.
      #
      # It renames the product (and the binary) to `ninja-recorder-dev`,
      # which is what makes this a separate application to Windows rather
      # than a rival copy of the real one. NSIS keys everything off
      # productName: the uninstall entry
      # (HKCU\...\Uninstall\<productName>), the default install directory
      # (%LOCALAPPDATA%\<productName>) and the shortcut. While the two
      # shared it, running this installer made NSIS treat the real install
      # as an older version of *itself* and uninstall it first — and that
      # step aborts the whole install with "Unable to uninstall!" if the
      # old uninstaller returns non-zero or leaves the binary behind, which
      # a still-running app is enough to cause. mainBinaryName splits the
      # process name too, so neither installer's "close the running app"
      # check can reach across at the other. The two now install side by
      # side. The identifier is deliberately *not* overridden, so the
      # portal still opens the library the real app writes to.
      #
      # It also turns NSIS compression off. Compressing the ~200MB payload
      # (ffmpeg + the libobs DLLs) with solid LZMA is ~2min of makensis,
      # and it buys nothing here: this installer is attached to the draft
      # release and deleted before it is published, so nobody ever
      # downloads it. The production bundle keeps LZMA and its ~62MB
      # installer.
      #
      # NINJA_DEVTOOLS reaches vite through tauri's beforeBuildCommand, so
      # dev.html is emitted; --features devtools compiles the Rust side.
      - name: Build app
        env:
          NINJA_DEVTOOLS: ${{ matrix.devtools && '1' || '' }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.devtools && '--features devtools --config src-tauri/tauri.devtools.conf.json' || '' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninja-recorder${{ matrix.devtools && '-devtools' || '' }}-${{ matrix.platform }}-${{ github.sha }}
          path: src-tauri/target/release/bundle
          retention-days: 7
          if-no-files-found: error

  # Publishes a draft for every commit that lands on main, from the bundles
  # the matrix above just produced. Nothing is rebuilt and no tag is pushed:
  # a draft release holds its tag name without creating the ref, so the tag
  # only comes into existence if somebody publishes the draft — which is
  # also what keeps `version` above counting from a stable base.
  #
  # This replaces the old release.yml, which triggered on a manually pushed
  # tag and then had to go hunting for the ci.yml run that matched the
  # commit. Running in the same workflow makes the artifacts local, so the
  # cross-run download dance and its `actions: read` token are both gone.
  draft-release:
    name: Draft release
    if: needs.version.outputs.release == 'true'
    needs: [version, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 because the notes step below needs full history and
      # every tag to resolve the previous release and the commit range.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: ninja-recorder-windows-latest-${{ github.sha }}
          path: artifacts/windows

      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: ninja-recorder-macos-latest-${{ github.sha }}
          path: artifacts/macos

      # Notes are derived from the commit range since the previous release,
      # so each draft describes its own changes instead of repeating a
      # hardcoded blurb. Uses git log rather than GitHub's own generator
      # because that one lists merged PRs only, and this repo mixes PRs
      # with commits pushed straight to main — those would silently go
      # unlisted. Merge commits are dropped as noise, as are the version-bump
      # commits that older ranges still contain; nothing bumps a version in
      # the repo any more. The previous release is the newest *tag*, so
      # while a run of drafts goes unpublished each one accumulates the
      # whole range since the last published release, which is what you
      # want to read before deciding to publish. The standing install
      # caveats are appended below the changelog; keep them in sync with
      # DEVELOPMENT.md as the Phase 6/8 status changes.
      - name: Build release notes
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          {
            echo "## What's changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --invert-grep --grep='^Bump version to' \
                --pretty=format:'- %s' "${PREV}..${GITHUB_SHA}"
              echo
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_SHA}"
            else
              git log --no-merges --invert-grep --grep='^Bump version to' \
                --pretty=format:'- %s' "${GITHUB_SHA}"
              echo
            fi
            cat <<'CAVEATS'

          ## Before you install

          Unsigned build: Windows SmartScreen and macOS Gatekeeper will both
          warn on first run (no code-signing certificate configured yet). See
          the installer for your platform below.

          macOS builds only exercise the stub recorder from Phase 1 — real
          game capture is Windows-only (DEVELOPMENT.md §1.1). The Windows
          build includes the Phase 6 libobs capture backend, but it hasn't
          been verified against a real Vanguard-protected game yet
          (DEVELOPMENT.md §9, pending Phase 8).
          CAVEATS
          } > notes.md
          echo "--- generated notes ---"
          cat notes.md

      # Draft so a build never goes public before it's reviewed — publish
      # manually from the Releases page. `target_commitish` pins which
      # commit the tag lands on at that point, since the tag does not exist
      # until then.
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "ninja-recorder v${{ needs.version.outputs.version }}"
          body_path: notes.md
          draft: true
          prerelease: false
          files: |
            artifacts/windows/**/*.exe
            artifacts/macos/**/*.dmg
