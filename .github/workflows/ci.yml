name: CI

on:
  push:
    branches: [main]
    # A stable release is cut by pushing a tag, and only ever by a person
    # running `npm run release -- cut`. Everything that lands on main
    # publishes an *alpha prerelease* instead (DEVELOPMENT.md §15).
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  # Pull requests run `test` only (see `build` below), so a manual run is
  # how the full matrix — including the devtools bundle — gets exercised
  # from a branch before it is merged. A manual run only builds unless
  # `publish_release` is set, which is both how the release path gets
  # tested off main and the escape hatch for re-cutting a release from a
  # commit whose own run was lost.
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Mint a version and publish a release"
        type: boolean
        default: false

# Superseded pull-request runs are cancelled, which is most of the minute
# saving. Pushes to main are deliberately NOT grouped together: each one
# owes a release, so cancelling an in-flight run because a second commit
# landed would silently drop that commit's build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The version has to be settled before anything compiles: it is baked into
  # the binary, the installer filename and the About block, and a version
  # chosen after the build would disagree with all three.
  #
  # **The number a human moves, and the number CI counts.** `package.json`
  # holds the version being built toward, and only `npm run release -- next`
  # changes it. CI never invents one — it appends `-alpha.<commits since the
  # newest stable tag>`, which keeps the property the old commit-distance
  # scheme was built around: the version is a pure function of the commit, so
  # two pushes landing at once cannot claim the same one and re-running a
  # commit updates its own release rather than minting a second.
  #
  # What changed is that the *base* no longer moves on its own. It used to
  # advance a minor per commit, which made `1.0.0` a number you arrived at by
  # accident rather than declared (DEVELOPMENT.md §15).
  #
  # Skipped entirely on pull requests, which neither build nor release.
  version:
    name: Version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      channel: ${{ steps.pick.outputs.channel }}
      release: ${{ steps.pick.outputs.release }}
      # Whether this repository holds a signing key, and therefore whether it is
      # allowed to publish at all. Read here because `secrets` cannot be used in
      # a job-level `if` — see the `release` job.
      can_publish: ${{ steps.can_publish.outputs.can_publish }}
    steps:
      # Full history and every tag: the distance below is measured against
      # them, and a shallow clone would silently under-count.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Can this repository publish?
        id: can_publish
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "No TAURI_SIGNING_PRIVATE_KEY — building without publishing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pick version
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.publish_release }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          # Stable tags only. A prerelease tag carries a `-`, and letting one
          # in here would make the alpha counter restart on every alpha.
          #
          # `sed` rather than `grep -v -- -`: a lone dash as a grep pattern is
          # ambiguous enough that not every grep accepts it (ugrep rejects it
          # outright), and this is not worth depending on the runner's.
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed '/-/d' | sort -V | tail -1)

          if [ "${REF#refs/tags/v}" != "$REF" ]; then
            # A tag push: the deliberate act. `release.mjs` only ever tags the
            # declared version, so a mismatch means the tag was pushed by hand
            # against a tree that says something else — which would publish a
            # release named after a version it does not contain.
            version=${REF#refs/tags/v}
            if [ "$version" != "$declared" ]; then
              echo "::error::tag v$version does not match package.json ($declared)" >&2
              exit 1
            fi
            channel=stable
            release=true
          else
            if [ -n "$newest" ] && [ "${newest#v}" = "$declared" ]; then
              # Alphas of an already-released version sort *below* it —
              # 0.9.0-alpha.1 < 0.9.0 — so every one would be invisible to the
              # updater. Declare the next version first.
              echo "::error::package.json still says $declared, which is already released as $newest. Run: npm run release -- next <x.y.z>" >&2
              exit 1
            fi
            # Anchored on the commit that *declared* this version, not on the
            # newest stable tag. Those coincide only when a declaration
            # immediately follows a cut, and when they diverge the number is
            # nonsense: 1.0.0 was declared eleven commits after v0.188.0, so
            # its first alpha published as `1.0.0-alpha.11`. The counter is
            # meant to say "the Nth alpha of the version being built toward",
            # which is what people read it as.
            #
            # `-S` finds the commit where that exact version string entered
            # package.json, so the declaration's own build is alpha.1.
            anchor=$(git log -1 --format=%H -S"\"version\": \"$declared\"" -- package.json)
            if [ -n "$anchor" ]; then
              n=$(( $(git rev-list --count "${anchor}..HEAD") + 1 ))
            elif [ -n "$newest" ]; then
              # No anchor: the version predates this scheme, or history was
              # rewritten under it. Fall back to the old measure rather than
              # publishing everything as alpha.1.
              n=$(git rev-list --count "${newest}..HEAD")
            else
              n=$(git rev-list --count HEAD)
            fi
            version="${declared}-alpha.${n}"
            channel=alpha
            # A plain manual run builds without publishing, so an installer
            # produced off a branch never claims to be a release.
            if [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ]; then
              release=true
            else
              release=false
            fi
          fi

          echo "declared=$declared newest_stable=${newest:-<none>} -> $version ($channel, release=$release)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Windows-only, which is now the whole of CI: nothing here builds or
  # tests on another platform. The work in this job — tsc, cargo test,
  # clippy — is platform-independent, and GitHub bills macOS runners at
  # 10x wall-clock against the free plan's 2,000 min/month.
  #
  # The cost, stated: **no CI job compiles the non-Windows code paths any
  # more.** `StubRecorder` and everything behind `cfg(not(target_os =
  # "windows"))` are what make `cargo test` work on a dev box, and a break
  # in them now surfaces on that box rather than here. That is the accepted
  # trade — the dev loop hits it in seconds — but it is a real gap, not an
  # oversight. Kept as a single-entry matrix so adding a runner back is a
  # one-line change.
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # 22, not 20. Vitest 5 refuses to run on anything below 22.12
      # (`engines: ^22.12.0 || ^24 || >=26`), and Node 20 went out of
      # maintenance in April 2026. Both jobs move together so there is one
      # Node in this workflow rather than two.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # No version argument, deliberately: that is what makes the action read
      # `src-tauri/rust-toolchain.toml` instead of overriding it. `@stable`
      # here would silently un-pin the compiler while the file sat in the tree
      # looking like it was in force.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # The order below is the plan's §4.7, and it is an order rather than a
      # list: the cheap gates run first so a formatting mistake fails in
      # seconds instead of after a four-minute compile.
      - name: Install frontend dependencies
        run: npm ci

      # Lint and format in one binary. `ci` is the non-writing mode — it
      # reports what `npm run format` would change and fails rather than
      # changing it.
      - name: Lint and format check (Biome)
        run: npx biome ci .

      - name: Type-check frontend
        run: npx tsc --noEmit

      # WS4.1: uncomment when the first `.svelte` file lands. `tsc` does not
      # see `.svelte` files at all, so without this the type gate silently
      # narrows to "the TypeScript that is left".
      # - name: Type-check Svelte
      #   run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Frontend tests
        run: npx vitest run

      # Licences and advisories. This is the v2.1 licence exit's instrument,
      # not hygiene: `deny.toml` allows GPL for exactly two named things, and
      # deleting them is what proves no other copyleft crept in. See
      # docs/provenance.md.
      - name: Licences and advisories (cargo-deny)
        working-directory: src-tauri
        run: cargo deny check

      # The contract gate. `gen-contract --check` re-emits the TypeScript from
      # the Rust declaration and fails if it differs from what is committed, so
      # a command or event added without regenerating cannot merge.
      #
      # This is what `every_command_round_trips` and the dev portal's drift
      # banner were standing in for. WS2.7 deletes both; they stay until then
      # because deleting them is that task's exit criterion, not this one's.
      - name: Contract drift
        working-directory: src-tauri
        run: cargo run --bin gen-contract -- --check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # The dev portal (`src-tauri/src/dev/`, DEVELOPMENT.md §10) is behind
      # an off-by-default feature, so nothing above compiles it. Without
      # this step a `#[cfg(feature = "devtools")]` mistake stays green
      # until someone runs the portal locally.
      - name: Run Rust tests (devtools)
        working-directory: src-tauri
        run: cargo test --features devtools

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings

      - name: Clippy (devtools)
        working-directory: src-tauri
        run: cargo clippy --features devtools --no-deps -- -D warnings

      # --- Does it actually run? -------------------------------------------
      #
      # Everything above is a claim about types, units and framing. None of it
      # starts the binary, and the daemon is a *process*: `main.rs`,
      # `Paths::resolve`, the single-instance check, the log file and the pipe's
      # security descriptor only exist when something is launched.
      #
      # That gap was not theoretical. The first report from a real Windows box
      # was "a console window appears and instantly closes", with no log to say
      # why, and narrowing it took an hour of remote PowerShell against a
      # machine nobody could see. This job answers that class of question in the
      # four minutes it already spends compiling.
      #
      # It does not replace `docs/windows-verification.md`. The tray, the
      # notifications and the capture backend still need a person at a desktop.
      # What this covers is everything that can be asserted without one.
      - name: Build the binary to smoke test
        working-directory: src-tauri
        run: cargo build --bin ninja-recorder --features devtools

      # `powershell` rather than the default `pwsh`: `PipeStream.GetAccessControl`
      # is an instance method in Windows PowerShell and moved to a static helper
      # in .NET Core, and the ACL is the check this step exists for. The script
      # handles both, but the shell that needs no fallback is the one to use.
      - name: Smoke test the daemon
        shell: powershell
        run: ./scripts/smoke-daemon.ps1

      # The other half, and a different question. The daemon smoke asks whether
      # the recorder runs; this asks whether the *window* process gets as far as
      # its own startup, starts a daemon when none is listening, and completes a
      # handshake over the pipe.
      #
      # A headless runner is not a desktop, so nothing here asserts that
      # anything is drawn. What it does assert is the failure that was reported
      # from the field and could not be diagnosed: a UI that exits before
      # `log::init` leaves no log, and a windowed build throws away the stderr
      # that would have said why. A redirected stderr and an exit code are
      # exactly what CI can keep.
      - name: Smoke test the UI
        shell: powershell
        run: ./scripts/smoke-ui.ps1

  # Pull requests do not build at all. Three Tauri bundles — two of them
  # Windows, each ~6min — are the overwhelming majority of this workflow's
  # minute spend and its artifact storage, and nothing consumes a PR's
  # bundles: they are not released, and the review that matters happens in
  # the diff and in `test`. A branch that genuinely needs an installer can
  # get the full matrix from `gh workflow run ci.yml --ref <branch>`.
  #
  # Deliberately NOT `needs: test` — the two jobs are independent work and
  # gating cost the whole test job (~4min) of pure latency on every push to
  # main before the slow Windows bundle even started. Nothing unreviewed
  # escapes as a result, because `release` below needs both.
  #
  # The devtools bundle (a second full Tauri build, DEVELOPMENT.md §10)
  # gets its own matrix entry, and therefore its own runner, rather than
  # running serially after the production bundle in the same job — that
  # second build used to sit squarely on the critical path.
  #
  # It is never attached to a release. The installer it produces carries
  # raw SQL execution, arbitrary row writes, a database wipe and
  # state-machine injection, and an asset that must be deleted before
  # publishing is one forgotten click away from shipping all of that. It
  # is reachable only as a workflow artifact — from a push to main or a
  # `workflow_dispatch` run — which expires on its own and can never be
  # published by accident.
  #
  # Both entries are Windows: real capture is Windows-only
  # (DEVELOPMENT.md §1.1), so it is the only platform whose bundle is worth
  # producing. A macOS `.dmg` used to be built here as a dev convenience;
  # it shipped the stub recorder, could not capture a game, and is gone.
  build:
    name: Build (${{ matrix.platform }}${{ matrix.devtools && ', devtools' || '' }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: windows-latest
            bundles: nsis
            devtools: true
    needs: version
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # 22, not 20. Vitest 5 refuses to run on anything below 22.12
      # (`engines: ^22.12.0 || ^24 || >=26`), and Node 20 went out of
      # maintenance in April 2026. Both jobs move together so there is one
      # Node in this workflow rather than two.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Same as `test`: no version argument, so `rust-toolchain.toml` is
      # what decides. The shipped installer and the tests that cleared it
      # have to be built by the same compiler for either result to mean
      # anything.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Stamped in, never committed: the release is cut from the artifacts
      # rather than from a bumped commit, so main keeps no bump commits and
      # CI never pushes to itself. Deliberately after `Cache Rust`, whose
      # key is hashed from the committed manifests — editing them first
      # would mint a new key every run and make the Rust cache permanently
      # cold. All three files matter: Cargo.toml is what cargo compiles,
      # tauri.conf.json is what names the installer, and package.json is
      # what vite bakes into `__APP_VERSION__` for the About block.
      - name: Set release version
        if: needs.version.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const toml = "src-tauri/Cargo.toml";
            fs.writeFileSync(toml, fs.readFileSync(toml, "utf8")
              .replace(/^version = ".*"$/m, `version = "${v}"`));
          '
          echo "building as $VERSION"

      # The staged backend is keyed on the exact libobs-recorder revision
      # Cargo.lock links against, which does double duty: it is a stable
      # cache key, and it stops the out-of-process worker staged below
      # from drifting away from the in-process crate the app is compiled
      # against — the old `git clone --depth 1` followed whatever HEAD
      # happened to be, while Cargo used the locked rev.
      - name: Resolve libobs backend revision
        if: matrix.platform == 'windows-latest'
        id: libobs-rev
        shell: bash
        run: |
          rev=$(grep -A3 '^name = "libobs-recorder"$' src-tauri/Cargo.lock |
            sed -nE 's/^source = ".*#([0-9a-f]{40})"$/\1/p')
          if [ -z "$rev" ]; then
            echo "::error::Could not read the libobs-recorder revision out of src-tauri/Cargo.lock" >&2
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # Both staging steps below write into src-tauri/target/libobs and
      # neither output depends on this repo's own sources, so the whole
      # directory caches as a unit. ffmpeg has no version to key on (see
      # the download step), so bump FFMPEG_EPOCH in the key to pull a
      # fresher build; GitHub also evicts caches untouched for 7 days,
      # which refreshes it on its own.
      - name: Cache libobs backend + ffmpeg
        if: matrix.platform == 'windows-latest'
        id: libobs-cache
        uses: actions/cache@v6
        with:
          path: src-tauri/target/libobs
          key: libobs-${{ runner.os }}-${{ steps.libobs-rev.outputs.rev }}-ffmpeg-epoch2

      # Builds the out-of-process libobs worker from our capture-backend
      # fork (github.com/NinjaGoldfinch/libobs-recorder — see
      # DEVELOPMENT.md §2.1) and stages it + its bundled libobs DLLs at
      # src-tauri/target/libobs/, where tauri.windows.conf.json picks it up
      # as a bundle resource and lib.rs's `LibObsRecorder::new` resolves it
      # from at runtime. Deliberately a step outside Cargo's own dependency
      # graph, not a Cargo artifact-dependency — that requires nightly
      # Rust + the unstable `bindeps` flag, which would force the whole
      # project — including a dev box's `cargo check` — onto nightly just
      # for a Windows-only optional binary. The staged backend this produces
      # has since been confirmed capturing real Vanguard-protected games.
      - name: Stage libobs capture backend
        if: matrix.platform == 'windows-latest' && steps.libobs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $rev = "${{ steps.libobs-rev.outputs.rev }}"
          New-Item -ItemType Directory -Force -Path ../libobs-recorder-build | Out-Null
          git init ../libobs-recorder-build
          git -C ../libobs-recorder-build remote add origin https://github.com/NinjaGoldfinch/libobs-recorder.git
          git -C ../libobs-recorder-build fetch --depth 1 origin $rev
          git -C ../libobs-recorder-build checkout FETCH_HEAD
          cargo build --release --manifest-path ../libobs-recorder-build/Cargo.toml --bin extprocess_recorder
          $dllDir = Get-ChildItem ../libobs-recorder-build/build-helper -Directory -Filter "libobs_*" |
            Sort-Object Name -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/target/libobs | Out-Null
          Copy-Item "$($dllDir.FullName)/*" src-tauri/target/libobs -Recurse -Force
          Copy-Item ../libobs-recorder-build/target/release/extprocess_recorder.exe src-tauri/target/libobs/extprocess_recorder.exe -Force

      # The **lgpl** build, not gpl. Every ffmpeg invocation this app makes is
      # `-c copy` — the faststart remux (`recorder/libobs/mod.rs`) and stem
      # extraction (`audio_tracks.rs`) are both stream copies, and libobs does
      # all the encoding — so not one GPL-only encoder is ever reachable.
      # Dropping x264/x265 and friends takes ~13% off a bundle that is a large
      # share of the 248 MB install (docs/windows-verification.md §5).
      #
      # ffmpeg.exe is bundled into the same `libobs` resource folder so
      # `LibObsRecorder::stop` (src-tauri/src/recorder/libobs/mod.rs) can
      # remux each recording to a seekable faststart MP4 after capture —
      # the crash-safe fragmented format `start()` records with has no
      # seek index (DEVELOPMENT.md §2.2). Optional at
      # runtime (lib.rs resolves it with `.ok()`), so a failed/missing
      # download here degrades to unseekable-but-playable recordings
      # rather than breaking the build. BtbN's "latest" release is a
      # continuously-updated static build, not a pinned version — same
      # looseness as the fork clone above had before it was pinned.
      - name: Stage ffmpeg for faststart remux
        if: matrix.platform == 'windows-latest' && steps.libobs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $bin = Get-ChildItem ffmpeg-extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/target/libobs | Out-Null
          Copy-Item $bin.FullName src-tauri/target/libobs/ffmpeg.exe -Force

      # Native, on Windows's own runner — never cross-compiled. NSIS rather
      # than MSI, matching the documented installer choice
      # (DEVELOPMENT.md §9).
      #
      # The devtools variant additionally layers tauri.devtools.conf.json
      # over the config, which does two things.
      #
      # It renames the product (and the binary) to `ninja-recorder-dev`,
      # which is what makes this a separate application to Windows rather
      # than a rival copy of the real one. NSIS keys everything off
      # productName: the uninstall entry
      # (HKCU\...\Uninstall\<productName>), the default install directory
      # (%LOCALAPPDATA%\<productName>) and the shortcut. While the two
      # shared it, running this installer made NSIS treat the real install
      # as an older version of *itself* and uninstall it first — and that
      # step aborts the whole install with "Unable to uninstall!" if the
      # old uninstaller returns non-zero or leaves the binary behind, which
      # a still-running app is enough to cause. mainBinaryName splits the
      # process name too, so neither installer's "close the running app"
      # check can reach across at the other. The two now install side by
      # side. The identifier is deliberately *not* overridden, so the
      # portal still opens the library the real app writes to.
      #
      # It also turns NSIS compression off. Compressing the ~200MB payload
      # (ffmpeg + the libobs DLLs) with solid LZMA is ~2min of makensis,
      # and it buys nothing here: this installer never reaches a release,
      # only a workflow artifact somebody deliberately downloads. The
      # production bundle keeps LZMA and its ~62MB installer.
      #
      # NINJA_DEVTOOLS reaches vite through tauri's beforeBuildCommand, so
      # dev.html is emitted; --features devtools compiles the Rust side.
      #
      # `TAURI_SIGNING_PRIVATE_KEY` is what turns `createUpdaterArtifacts`
      # into a signed `.sig` next to the installer, and the matching public
      # key in `tauri.conf.json` is what every installed build checks it
      # against. **The pair is permanent**: the public half is baked into
      # every installer ever shipped, so losing the private half strands
      # every install in the field on its current version
      # (DEVELOPMENT.md §14).
      #
      # Harmless on the devtools entry, which produces no updater artifact:
      # it sets `createUpdaterArtifacts: false` in
      # `tauri.devtools.conf.json` so it can never update itself into the
      # production app.
      # `tauri.conf.json` sets `createUpdaterArtifacts: true`, so `tauri build`
      # signs the updater bundle — and fails outright when the key is empty:
      #
      #   failed to decode secret key: incorrect updater private key password:
      #   Missing comment in secret key
      #
      # That is not a build failure, it is a "this repository cannot sign"
      # failure, and it arrives eleven minutes into a Windows bundle. The
      # devtools entry never hit it only because its own config turns updater
      # artifacts off, for unrelated reasons.
      #
      # Without a key: build the installer, skip the updater artifacts. The
      # bundle is still produced and still verifiable, which is the part worth
      # having on a fork or a repository that has not been given the key yet.
      # What is lost is the `.sig` and the updater zip — which an unsigned
      # repository could not publish anyway, and `release` is gated on the same
      # key, so the two stay consistent.
      #
      # The arguments are assembled in bash rather than templated into the
      # `run:` line: the matrix decides three different things here, and
      # generating shell source from `${{ }}` to express that is how a quoting
      # bug ends up only reproducible on a Windows runner.
      - name: Build app
        env:
          NINJA_DEVTOOLS: ${{ matrix.devtools && '1' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DEVTOOLS: ${{ matrix.devtools && '1' || '' }}
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--bundles "$BUNDLES")
          if [ -n "${DEVTOOLS:-}" ]; then
            args+=(--features devtools --config src-tauri/tauri.devtools.conf.json)
          elif [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::notice::No TAURI_SIGNING_PRIVATE_KEY — building the installer without updater artifacts."
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npm run tauri build -- "${args[@]}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ninja-recorder${{ matrix.devtools && '-devtools' || '' }}-${{ matrix.platform }}-${{ github.sha }}
          path: src-tauri/target/release/bundle
          retention-days: 7
          if-no-files-found: error

  # Publishes a release for every commit that lands on main, from the
  # bundles the matrix above just produced. Nothing is rebuilt.
  #
  # `needs: [version, test, build]` is the gate that makes this safe to
  # publish unattended rather than leave as a draft: it cannot start until
  # tsc, cargo test and clippy have all gone green on the same commit, so
  # "published" already means "tested". Publishing creates the tag, which
  # becomes the base `version` counts from next time.
  #
  # This replaces the old release.yml, which triggered on a manually pushed
  # tag and then had to go hunting for the ci.yml run that matched the
  # commit. Running in the same workflow makes the artifacts local, so the
  # cross-run download dance and its `actions: read` token are both gone.
  release:
    name: Release
    # Two conditions, and the second is a guard rather than policy.
    #
    # **Without it, the first push to main in a fresh clone publishes a
    # release.** `version` sets `release=true` for any push to main, so merging
    # a branch mints `<declared>-alpha.<n>`, builds two Windows bundles, and
    # then fails partway through this job — *after* creating the GitHub Release
    # — because the updater artifacts cannot be signed. That leaves a broken
    # release to delete by hand, on a repository whose README says there are
    # none.
    #
    # `can_publish` comes from the `version` job because **the `secrets` context
    # is not available in a job-level `if`** — it has to be read inside a step
    # and handed on as an output. The signing key doubles as the switch that
    # says "this repository is allowed to publish": a fork has none and quietly
    # builds without publishing. This repository now holds the key, so it
    # publishes — the pair is the same one v1 ships with, because the public
    # half is baked into every installer already in the field.
    if: needs.version.outputs.release == 'true' && needs.version.outputs.can_publish == 'true'
    needs: [version, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 because the notes step below needs full history and
      # every tag to resolve the previous release and the commit range.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows bundle
        uses: actions/download-artifact@v8
        with:
          name: ninja-recorder-windows-latest-${{ github.sha }}
          path: artifacts/windows

      # Notes are derived from the commit range since the previous release,
      # so each release describes its own changes instead of repeating a
      # hardcoded blurb. Uses git log rather than GitHub's own generator
      # because that one lists merged PRs only, and this repo mixes PRs
      # with commits pushed straight to main — those would silently go
      # unlisted. Merge commits are dropped as noise, as are the version-bump
      # commits that older ranges still contain; nothing bumps a version in
      # the repo any more. The previous release is the newest *tag*, which
      # this job creates on every publish, so each range is exactly one
      # commit's worth of changes unless a run failed. The standing install
      # caveats are appended below the changelog; keep them in sync with
      # docs/windows-verification.md as the capture-backend status changes.
      - name: Build release notes
        env:
          TAG: v${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          # A stable release describes the whole cycle since the last stable
          # one; an alpha describes the commit that produced it. Measuring
          # both from the last stable tag would make every alpha repeat the
          # entire changelog so far.
          if [ "$CHANNEL" = "stable" ]; then
            PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed '/-/d' | sort -V | tail -1)
          else
            PREV=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          fi
          # Two files, because they have two audiences. `changelog.md` is
          # what changed and nothing else — it goes into the update manifest,
          # and from there into the app's own update panel. `notes.md` is that
          # plus the standing install caveats, which are written for someone
          # downloading an installer from the Releases page and are actively
          # wrong in the in-app panel: "SmartScreen warns on first run" is
          # not advice for a person clicking Install inside a running app.
          {
            echo "## What's changed"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --invert-grep --grep='^Bump version to' \
                --pretty=format:'- %s' "${PREV}..${GITHUB_SHA}"
              echo
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_SHA}"
            else
              git log --no-merges --invert-grep --grep='^Bump version to' \
                --pretty=format:'- %s' "${GITHUB_SHA}"
              echo
            fi
          } > changelog.md

          {
            cat changelog.md
            cat <<'CAVEATS'

          ---

          **This build is not fully verified.** v2 rebuilt the process model:
          the recorder is now a headless daemon and the window is a client of
          it. CI starts both processes on Windows on every push and checks the
          pipe, its permissions, the handshake, the tray and the reconnect, but
          nothing involving a real game, a GPU, a visible menu or a toast has
          been confirmed on a desktop yet. Expect rough edges, and see
          https://github.com/NinjaGoldfinch/ninja-recorder-v2/issues/130 for
          what is still being checked.

          Unsigned build: Windows SmartScreen will warn on first run. No
          code-signing certificate is configured yet.
          CAVEATS
          } > notes.md
          echo "--- changelog.md (goes to the app) ---"
          cat changelog.md
          echo "--- notes.md (goes to the release page) ---"
          cat notes.md

      # The update manifest every installed build polls, written from the
      # artifacts this run just produced rather than from a template — the
      # signature has to be the one that goes with *this* installer.
      #
      # `windows-x86_64` is the only platform key, because Windows is the
      # only platform that ships. A build made anywhere else finds no entry
      # and reports "not available in this build" (DEVELOPMENT.md §14).
      #
      # The `url` is the **tagged** asset path, not `/releases/latest/`. The
      # endpoint that fetches this file is allowed to float to the newest
      # release; what it points *at* must not, or an installer download would
      # silently follow the next release and stop matching the signature
      # beside it.
      - name: Build update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail
          setup=$(find artifacts/windows -name '*-setup.exe' | head -1)
          if [ -z "$setup" ]; then
            echo "::error::No NSIS installer in the Windows bundle" >&2
            exit 1
          fi
          if [ ! -f "$setup.sig" ]; then
            echo "::error::No signature beside $setup. Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets, and put the matching public key in src-tauri/tauri.conf.json under plugins.updater.pubkey (DEVELOPMENT.md 14)." >&2
            exit 1
          fi
          # `latest.json` for stable, `alpha.json` for alpha. Two files
          # rather than one with a channel field, because the *endpoint* is
          # what separates the channels: semver says 1.1.0-alpha.1 > 1.0.0,
          # so a stable install that could see the alpha manifest at all
          # would be offered alphas by default (DEVELOPMENT.md §15).
          manifest=latest.json
          [ "$CHANNEL" = "alpha" ] && manifest=alpha.json
          echo "manifest=$manifest" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs"), path = require("path");
            const setup = process.argv[1];
            const v = process.env.VERSION;
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${v}`;
            fs.writeFileSync(process.argv[2], JSON.stringify({
              version: v,
              // The changelog only — this is what the app renders in
              // Settings -> About, and the release page caveats below it
              // are written for a different reader entirely.
              notes: fs.readFileSync("changelog.md", "utf8"),
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(setup + ".sig", "utf8").trim(),
                  url: `${base}/${encodeURIComponent(path.basename(setup))}`,
                },
              },
            }, null, 2) + "\n");
          ' "$setup" "$manifest"
          echo "--- $manifest ---"
          cat "$manifest"

      # Published, not drafted: the `needs` above already withhold this
      # step until the commit's tests pass, so a human clicking Publish
      # added latency rather than a check. `target_commitish` pins which
      # commit the tag is created on.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "ninja-recorder v${{ needs.version.outputs.version }}"
          body_path: notes.md
          draft: false
          # Alphas are prereleases, which is load-bearing rather than
          # cosmetic: GitHub excludes prereleases from
          # `/releases/latest/download/`, so the stable channel's endpoint
          # ignores them with no filtering of our own.
          prerelease: ${{ needs.version.outputs.channel == 'alpha' }}
          files: |
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.sig
            ${{ env.manifest }}

      # The alpha channel needs a URL that does not move, and
      # `/releases/latest/download/` cannot be it — GitHub excludes
      # prereleases from `latest`, which is precisely what keeps the stable
      # channel clean. So one permanent prerelease, tagged `alpha`, holds the
      # alpha manifest and nothing else, and its single asset is replaced on
      # every build. The installers stay on their own `-alpha.N` releases;
      # this only ever points at them.
      - name: Publish the alpha manifest
        if: needs.version.outputs.channel == 'alpha'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view alpha >/dev/null 2>&1; then
            gh release create alpha \
              --prerelease \
              --title "Alpha channel" \
              --target "$GITHUB_SHA" \
              --notes "Rolling pointer for the alpha update channel. The manifest attached here is what an alpha install polls; the builds themselves are the -alpha.N prereleases."
          fi
          gh release upload alpha alpha.json --clobber
