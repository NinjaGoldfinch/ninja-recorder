name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows-only: GitHub bills macOS runners at 10x wall-clock against the
  # free plan's 2,000 min/month, and this job's work — tsc, cargo test,
  # clippy — is platform-independent, so running it twice bought almost
  # nothing for most of CI's minute spend. The `build` job below still
  # runs the full matrix natively, so macOS-specific compile breakage
  # (cfg'd code, the Phase 1 stub recorder) is still caught before a
  # release — one job later than it used to be. Kept as a single-entry
  # matrix so re-adding macos-latest here is a one-word change.
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      # TEMPORARY diagnostic — remove before merge. The Windows test binary
      # dies with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) before any test
      # runs, meaning a DLL is present but missing an expected export. This
      # names which one instead of guessing across CI runs.
      - name: Diagnose Windows test binary (temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --no-run
          $exe = Get-ChildItem target\debug\deps\ninja_recorder_lib-*.exe |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "=== test exe: $($exe.FullName)"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          Write-Host "=== imports (dumpbin /dependents)"
          & $dumpbin.FullName /dependents $exe.FullName
          Write-Host "=== DLLs beside the exe (deps/)"
          Get-ChildItem target\debug\deps\*.dll -ErrorAction SilentlyContinue |
            ForEach-Object { "{0}`t{1}`t{2}" -f $_.Name, $_.Length, $_.VersionInfo.FileVersion }
          Write-Host "=== DLLs in target\debug"
          Get-ChildItem target\debug\*.dll -ErrorAction SilentlyContinue |
            ForEach-Object { "{0}`t{1}`t{2}" -f $_.Name, $_.Length, $_.VersionInfo.FileVersion }
          Write-Host "=== direct run"
          & $exe.FullName --list 2>&1 | Select-Object -First 15
          Write-Host "=== exit code: $LASTEXITCODE"

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Builds the out-of-process libobs worker from our capture-backend
      # fork (github.com/NinjaGoldfinch/libobs-recorder — see
      # DEVELOPMENT.md §2.1) and stages it + its bundled libobs DLLs at
      # src-tauri/target/libobs/, where tauri.windows.conf.json picks it up
      # as a bundle resource and lib.rs's `LibObsRecorder::new` resolves it
      # from at runtime. Deliberately a step outside Cargo's own dependency
      # graph, not a Cargo artifact-dependency — that requires nightly
      # Rust + the unstable `bindeps` flag, which would force the whole
      # project (including every macOS dev's `cargo check`) onto nightly
      # just for a Windows-only optional binary. Unverified — see
      # DEVELOPMENT.md §2.2's Phase 6 status note.
      - name: Stage libobs capture backend
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/NinjaGoldfinch/libobs-recorder.git ../libobs-recorder-build
          cargo build --release --manifest-path ../libobs-recorder-build/Cargo.toml --bin extprocess_recorder
          $dllDir = Get-ChildItem ../libobs-recorder-build/build-helper -Directory -Filter "libobs_*" |
            Sort-Object Name -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/target/libobs | Out-Null
          Copy-Item "$($dllDir.FullName)/*" src-tauri/target/libobs -Recurse -Force
          Copy-Item ../libobs-recorder-build/target/release/extprocess_recorder.exe src-tauri/target/libobs/extprocess_recorder.exe -Force

      # ffmpeg.exe is bundled into the same `libobs` resource folder so
      # `LibObsRecorder::stop` (src-tauri/src/recorder/libobs/mod.rs) can
      # remux each recording to a seekable faststart MP4 after capture —
      # the crash-safe fragmented format `start()` records with has no
      # seek index (DEVELOPMENT.md, Phase 6 follow-up). Optional at
      # runtime (lib.rs resolves it with `.ok()`), so a failed/missing
      # download here degrades to unseekable-but-playable recordings
      # rather than breaking the build. BtbN's "latest" release is a
      # continuously-updated static build, not a pinned version — same
      # looseness as this job's own unpinned `git clone` above.
      - name: Stage ffmpeg for faststart remux
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted
          $bin = Get-ChildItem ffmpeg-extracted -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $bin.FullName src-tauri/target/libobs/ffmpeg.exe -Force

      # Native build on each platform's own runner — never cross-compiled.
      # DEVELOPMENT.md §9: NSIS on Windows (not MSI, matches the documented
      # installer choice); dmg on macOS is the standard Tauri bundle format
      # there. macOS builds only exercise the stub recorder (Phase 1) —
      # real capture is Windows-only (Phase 6).
      - name: Build app
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninja-recorder-${{ matrix.platform }}-${{ github.sha }}
          path: src-tauri/target/release/bundle
          retention-days: 7
          if-no-files-found: error
