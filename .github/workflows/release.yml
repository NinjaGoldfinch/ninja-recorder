name: Release

# Publishes installers for a tagged commit without rebuilding them: ci.yml's
# `build` job already compiles both platforms on every push to main with a
# warm Rust cache and uploads the bundles as artifacts. Rebuilding here via
# tauri-action was redundant *and* always cold — GitHub Actions cache
# scoping falls back from a branch to its default branch, but never from a
# tag, so a tag-triggered build could never see ci.yml's cache and paid a
# full ~15min compile (mostly Windows) on every release. Reusing the
# already-built, already-tested artifact instead turns this into a
# download-and-publish job.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Find CI run for this commit
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful ci.yml run found for ${GITHUB_SHA}. Push this commit to main and wait for CI to pass before tagging it." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: ninja-recorder-windows-latest-${{ github.sha }}
          path: artifacts/windows
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: ninja-recorder-macos-latest-${{ github.sha }}
          path: artifacts/macos
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Draft so a broken build doesn't go public before it's reviewed —
      # publish manually from the Releases page.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ninja-recorder ${{ github.ref_name }}"
          body: |
            Unsigned build: Windows SmartScreen and macOS Gatekeeper will
            both warn on first run (no code-signing certificate configured
            yet). See the installer for your platform below.

            macOS builds only exercise the stub recorder from Phase 1 —
            real game capture is Windows-only (DEVELOPMENT.md §1.1). The
            Windows build includes the Phase 6 libobs capture backend, but
            it hasn't been verified against a real Vanguard-protected game
            yet (DEVELOPMENT.md §9, pending Phase 8).
          draft: true
          prerelease: false
          files: |
            artifacts/windows/**/*.exe
            artifacts/macos/**/*.dmg
