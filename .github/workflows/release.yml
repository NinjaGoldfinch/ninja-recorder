name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
          - platform: macos-latest
            args: --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # See ci.yml's matching step for what/why. Runs before tauri-action
      # so the installer bundles the staged libobs runtime files.
      - name: Stage libobs capture backend
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/NinjaGoldfinch/libobs-recorder.git ../libobs-recorder-build
          cargo build --release --manifest-path ../libobs-recorder-build/Cargo.toml --bin extprocess_recorder
          $dllDir = Get-ChildItem ../libobs-recorder-build/build-helper -Directory -Filter "libobs_*" |
            Sort-Object Name -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/target/libobs | Out-Null
          Copy-Item "$($dllDir.FullName)/*" src-tauri/target/libobs -Recurse -Force
          Copy-Item ../libobs-recorder-build/target/release/extprocess_recorder.exe src-tauri/target/libobs/extprocess_recorder.exe -Force

      # Both matrix legs publish to the same release (matched by tagName);
      # tauri-action creates it on the first leg to finish and appends
      # assets from the other. Draft so a broken build doesn't go public
      # before it's reviewed — publish manually from the Releases page.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ninja-recorder ${{ github.ref_name }}"
          releaseBody: |
            Unsigned build: Windows SmartScreen and macOS Gatekeeper will
            both warn on first run (no code-signing certificate configured
            yet). See the installer for your platform below.

            macOS builds only exercise the stub recorder from Phase 1 —
            real game capture is Windows-only (DEVELOPMENT.md §1.1). The
            Windows build includes the Phase 6 libobs capture backend, but
            it hasn't been verified against a real Vanguard-protected game
            yet (DEVELOPMENT.md §9, pending Phase 8).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
