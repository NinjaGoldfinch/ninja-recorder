# `cargo deny check advisories` on a timer.
#
# The licence and bans halves of `deny.toml` only change when the tree changes,
# so `ci.yml` covering them on push is enough. **Advisories are not like that.**
# A new RUSTSEC entry lands against a dependency graph nobody has touched, and
# on a part-time project the next push might be three weeks later — by which
# point the finding is stale news rather than a heads-up.
#
# This also re-checks the five `unic-*` advisories currently ignored in
# `deny.toml`. Those are ignored by ID with a stated reason, not blanket, and
# the reason ends when Tauri moves off `urlpattern`. A weekly run is what
# notices.
#
# Deliberately separate from `ci.yml` rather than a scheduled trigger on it:
# `ci.yml`'s `push` trigger mints versions and publishes releases, and a cron
# arriving in that workflow would have to be excluded from every one of those
# paths. A 20-line file is cheaper than that.
name: Advisories

on:
  schedule:
    # Mondays, 08:00 UTC. Early enough in the week that something found has
    # somewhere to go.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  advisories:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version argument: reads src-tauri/rust-toolchain.toml, same as CI.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check
        id: check
        working-directory: src-tauri
        run: cargo deny check advisories 2>&1 | tee "$RUNNER_TEMP/advisories.txt"

      # Only on failure, and only one issue at a time: a weekly cron that opens
      # a duplicate every Monday is how a repository teaches people to ignore
      # its automation.
      - name: Open an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync(process.env.RUNNER_TEMP + '/advisories.txt', 'utf8').slice(-8000);
            const title = 'RUSTSEC: cargo deny check advisories is failing';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'type: bug',
            });
            const dupe = existing.data.find(i => i.title === title);
            const body = [
              'The scheduled advisory check failed. This is a dependency-graph',
              'change, not a code change — nothing in this repository moved.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Either bump the dependency, or add the advisory to `deny.toml`',
              '`[advisories] ignore` **by ID with a written reason and an exit',
              'condition** — the existing entries are the pattern to follow.',
              '',
              '<details><summary>Output</summary>',
              '', '```', log, '```', '',
              '</details>',
            ].join('\n');
            if (dupe) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dupe.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['type: bug', 'WS5: toolchain', 'gate'],
              });
            }
